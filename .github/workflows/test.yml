name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 last_reply.py --test
